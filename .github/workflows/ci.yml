name: ci

# Runs the zig unit test suite and the offline smoke groups on a native runner
# for every platform the release workflow ships a binary for (linux x86_64 +
# aarch64, macos x86_64 + aarch64, windows x86_64). Because release tags are
# cut from master, a green matrix on master — and the tag push itself — means
# no platform-specific regression reaches a published binary untested.
#
# Everything runs through `shell: bash` (Git Bash on Windows) so the same
# commands work on every leg. Zig is invoked by absolute path — no PATH
# mutation needed, which avoids POSIX↔Windows path translation pitfalls.
#
# `workflow_call` lets the release workflow gate publishing on this matrix
# once both workflows are merged.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg per release artifact: the zig archive named here matches
          # the archive layout at https://ziglang.org/download/0.16.0/.
          - { os: ubuntu-latest,    label: linux-x86_64,   zig_pkg: zig-x86_64-linux-0.16.0,   ext: tar.xz, bin: tau }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,  zig_pkg: zig-aarch64-linux-0.16.0,  ext: tar.xz, bin: tau }
          - { os: macos-15-intel,   label: macos-x86_64,   zig_pkg: zig-x86_64-macos-0.16.0,   ext: tar.xz, bin: tau }
          - { os: macos-latest,     label: macos-aarch64,  zig_pkg: zig-aarch64-macos-0.16.0,  ext: tar.xz, bin: tau }
          - { os: windows-latest,   label: windows-x86_64, zig_pkg: zig-x86_64-windows-0.16.0, ext: zip,    bin: tau.exe }
    env:
      TAU_BIN: ${{ github.workspace }}/zig-out/bin/${{ matrix.bin }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/${{ matrix.zig_pkg }}.${{ matrix.ext }}" -o "$RUNNER_TEMP/zig.${{ matrix.ext }}"
          mkdir -p "$HOME/zig"
          tar -xf "$RUNNER_TEMP/zig.${{ matrix.ext }}" -C "$HOME/zig" --strip-components=1
          "$HOME/zig/zig" version

      - name: Install Zig 0.16.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://ziglang.org/download/0.16.0/${{ matrix.zig_pkg }}.${{ matrix.ext }}"
          curl.exe -fsSL $url -o "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" "$env:USERPROFILE"
          Move-Item "$env:USERPROFILE\${{ matrix.zig_pkg }}" "$env:USERPROFILE\zig"
          & "$env:USERPROFILE\zig\zig.exe" version

      - name: Ensure python3 is available (Windows)
        # The smoke harness drives several assertions through python3. GitHub
        # Windows images ship `python`; expose it as `python3` if the alias is
        # absent so scripts/smoke.sh runs unmodified.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shims"
            printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shims/python3"
            chmod +x "$RUNNER_TEMP/shims/python3"
            echo "$RUNNER_TEMP/shims" >> "$GITHUB_PATH"
          fi

      - name: Build
        shell: bash
        run: '"$HOME/zig/zig" build'

      - name: Unit tests
        shell: bash
        run: '"$HOME/zig/zig" build test --summary all'

      - name: Config schema drift check
        # schema/tau-config.schema.json is the published copy editors fetch
        # via the $schema URL — it must match `tau config schema` output
        # byte-for-byte (the unit suite pins the same invariant; this step
        # checks the shipped binary's output directly).
        # Regenerate: zig build && ./zig-out/bin/tau config schema > schema/tau-config.schema.json
        shell: bash
        run: '"$TAU_BIN" config schema | diff - schema/tau-config.schema.json'

      - name: Config doc drift check
        # docs/config.md is generated from the schema by
        # scripts/gen-config-doc.py — this proves the shipped reference is in
        # sync (the unit suite and the config-doc smoke group pin the same
        # invariant). Regenerate: python3 scripts/gen-config-doc.py
        shell: bash
        run: '"$TAU_BIN" config schema | python3 scripts/gen-config-doc.py - --check'

      - name: Env doc drift check
        # docs/env.md is generated from the TAU_* env-var Spec registry in
        # src/envvars.zig (the same registry the startup typo warning
        # scans) by scripts/gen-env-doc.py — this proves the shipped
        # reference is in sync (the unit suite and the env-doc smoke group
        # pin the same invariant). Regenerate: python3 scripts/gen-env-doc.py
        shell: bash
        run: python3 scripts/gen-env-doc.py --check

      - name: Compat doc drift check
        # docs/compatibility.md is generated from the ClientKind registry in
        # src/setup.zig (+ src/doctor.zig check/fix ids) by
        # scripts/gen-compat-doc.py — this proves the shipped matrix is in
        # sync (the unit suite and the compat-doc smoke group pin the same
        # invariant). Regenerate: python3 scripts/gen-compat-doc.py
        shell: bash
        run: python3 scripts/gen-compat-doc.py --check

      - name: Doctor checks doc drift check
        # The GENERATED DOCTOR CHECKS table in docs/troubleshooting.md is
        # spliced from the CheckSpec catalog in src/doctorcatalog.zig (the
        # same registry `tau explain doctor.<check>` reads) by
        # scripts/gen-doctor-checks-doc.py — this proves the doc is in sync
        # (the doctor-checks smoke group and the doctorcatalog.zig
        # doc-mirror unit test pin the same invariant).
        # Regenerate: python3 scripts/gen-doctor-checks-doc.py
        shell: bash
        run: python3 scripts/gen-doctor-checks-doc.py --check

      - name: Doctor stream schema + doc drift check
        # schema/tau-doctor.schema.json describes every NDJSON line
        # `tau doctor --json` emits — validate real shipped-binary output
        # against it (a keyless run covers check/verdict events; a --fix run
        # covers fix events and the verdict's fixes array), then prove the
        # generated reference doc is in sync. The doctor-schema smoke group
        # and the doctor.zig unit tests pin the same invariants.
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/plain" "$tmp/fix"
          rc=0
          env -u XIAOMI_API_KEY -u PIZIG_API_KEY -u OPENAI_API_KEY -u DEEPSEEK_API_KEY -u OPENCODE_API_KEY -u TAU_API_KEY \
            HOME="$tmp/plain" "$TAU_BIN" doctor --json --offline > "$tmp/plain.ndjson" || rc=$?
          [ "$rc" -le 1 ] || { echo "doctor exited $rc"; exit 1; }
          python3 scripts/check-doctor-schema.py "$tmp/plain.ndjson"
          rc=0
          env -u XIAOMI_API_KEY -u PIZIG_API_KEY -u OPENAI_API_KEY -u DEEPSEEK_API_KEY -u OPENCODE_API_KEY \
            TAU_API_KEY=sk-ci HOME="$tmp/fix" SHELL=/bin/bash "$TAU_BIN" doctor --json --offline --fix --yes \
            > "$tmp/fix.ndjson" || rc=$?
          [ "$rc" -le 1 ] || { echo "doctor --fix exited $rc"; exit 1; }
          python3 scripts/check-doctor-schema.py "$tmp/fix.ndjson"
          python3 scripts/gen-doctor-doc.py --check

      - name: CLI --json schema drift check
        # schema/tau-config-show.schema.json, schema/tau-config-validate.
        # schema.json, schema/tau-version.schema.json,
        # schema/tau-explain.schema.json, schema/tau-init.schema.json,
        # schema/tau-upgrade.schema.json, and schema/tau-bug.schema.json pin
        # the single-object stdout contracts; schema/tau-setup.schema.json
        # pins the setup NDJSON stream — validate real shipped-binary output
        # against them (the cli-schemas smoke group pins the same
        # invariants).
        # TAU_NO_UPDATE_CHECK keeps the --check leg offline.
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/home/.config/tau"
          printf '{"provider":"openai","api_key":"sk-ci"}' > "$tmp/home/.config/tau/config.json"
          "$TAU_BIN" version --json | python3 scripts/check-cli-schema.py --schema schema/tau-version.schema.json -
          "$TAU_BIN" version --json --verbose | python3 scripts/check-cli-schema.py --schema schema/tau-version.schema.json -
          TAU_NO_UPDATE_CHECK=1 "$TAU_BIN" version --json --check | python3 scripts/check-cli-schema.py --schema schema/tau-version.schema.json -
          HOME="$tmp/home" "$TAU_BIN" config show --json | python3 scripts/check-cli-schema.py --schema schema/tau-config-show.schema.json -
          "$TAU_BIN" config validate --json "$tmp/home/.config/tau/config.json" | python3 scripts/check-cli-schema.py --schema schema/tau-config-validate.schema.json -
          rc=0
          "$TAU_BIN" config validate --json <(printf '{"provider":"nope"}') > "$tmp/bad.json" || rc=$?
          [ "$rc" -eq 1 ] || { echo "config validate on a bad file exited $rc (want 1)"; exit 1; }
          python3 scripts/check-cli-schema.py --schema schema/tau-config-validate.schema.json "$tmp/bad.json"
          "$TAU_BIN" explain --json 106 | python3 scripts/check-cli-schema.py --schema schema/tau-explain.schema.json -
          "$TAU_BIN" explain --json TAU_ENDPOINT | python3 scripts/check-cli-schema.py --schema schema/tau-explain.schema.json -
          "$TAU_BIN" explain --json | python3 scripts/check-cli-schema.py --schema schema/tau-explain.schema.json -
          # init/setup/upgrade/bug emit JSON by default; --json pins the
          # schema-checked contract spelling (issue #315).
          mkdir -p "$tmp/init-home"
          env -u XIAOMI_API_KEY -u PIZIG_API_KEY -u OPENAI_API_KEY -u DEEPSEEK_API_KEY -u OPENCODE_API_KEY -u TAU_API_KEY \
            HOME="$tmp/init-home" "$TAU_BIN" init --json | python3 scripts/check-cli-schema.py --schema schema/tau-init.schema.json -
          rc=0
          TAU_NO_UPDATE_CHECK=1 "$TAU_BIN" upgrade --json > "$tmp/ug.json" || rc=$?
          [ "$rc" -eq 1 ] || { echo "upgrade --json with the check disabled exited $rc (want 1)"; exit 1; }
          python3 scripts/check-cli-schema.py --schema schema/tau-upgrade.schema.json "$tmp/ug.json"
          "$TAU_BIN" bug --json --offline --no-report | python3 scripts/check-cli-schema.py --schema schema/tau-bug.schema.json -
          mkdir -p "$tmp/setup-home"
          rc=0
          env -u PIZIG_API_KEY -u OPENAI_API_KEY -u DEEPSEEK_API_KEY -u OPENCODE_API_KEY -u TAU_API_KEY \
            HOME="$tmp/setup-home" SHELL=/bin/bash XIAOMI_API_KEY=sk-ci "$TAU_BIN" setup --json --offline > "$tmp/setup.ndjson" || rc=$?
          [ "$rc" -eq 0 ] || { echo "setup --json exited $rc (want 0)"; exit 1; }
          python3 scripts/check-setup-schema.py "$tmp/setup.ndjson"

      - name: Versioned schema drift check
        # schema/v<version>/ is the generated, release-anchored copy of every
        # stable --json output schema ($id re-anchored to the release tag,
        # plus index.json) published as the tau-schemas.tar.gz release asset.
        # Regenerate: python3 scripts/gen-versioned-schemas.py
        # (the versioned-schemas smoke group pins the same invariant).
        shell: bash
        run: python3 scripts/gen-versioned-schemas.py --check

      - name: Stability contract drift check
        # docs/stability.md is hand-written policy — this proves it still
        # names every catalog exit code, every schema/ file, and only links
        # to docs that exist (the stability-doc smoke group pins the same).
        shell: bash
        run: python3 scripts/check-stability-doc.py

      - name: Changelog drift check
        # The tagged-release sections of CHANGELOG.md are generated from
        # this repo's GitHub release notes by scripts/gen-changelog.py —
        # this proves what users audit before `tau upgrade` matches the
        # notes each release actually ships (the changelog smoke group
        # replays the same check offline against a recorded API snapshot).
        # If this fails after editing a release's notes, regenerate:
        #   python3 scripts/gen-changelog.py
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen-changelog.py --check

      - name: Offline smoke groups
        shell: bash
        run: ./scripts/smoke.sh

      - name: Offline feature smoke
        shell: bash
        run: ./scripts/smoke-features.sh --offline

  first-run:
    # Clean-environment first-run e2e: builds tau, stages it as a local
    # release tree (srv/latest/download/<asset> + SHA256SUMS.txt — the exact
    # layout the installers fetch), installs it through the shipped installer
    # (install.sh on POSIX, install.ps1 on Windows) against a file://
    # TAU_BASE_URL so nothing touches the network, then drives the documented
    # first-run path — `tau setup --yes`, `tau setup --client` for both the
    # direct-ACP (zed) and MCP-bridge (claude-desktop) wiring paths, and
    # `tau doctor --selftest` — in a scratch HOME with every credential
    # source scrubbed. Locks the install → onboard → wire → self-verify
    # chain for every released platform, Windows included.
    name: first-run (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg per release artifact, same zig archives as the test job.
          - { os: ubuntu-latest,    label: linux-x86_64,   zig_pkg: zig-x86_64-linux-0.16.0,   ext: tar.xz, asset: tau-linux-x86_64.tar.gz }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,  zig_pkg: zig-aarch64-linux-0.16.0,  ext: tar.xz, asset: tau-linux-aarch64.tar.gz }
          - { os: macos-15-intel,   label: macos-x86_64,   zig_pkg: zig-x86_64-macos-0.16.0,   ext: tar.xz, asset: tau-macos-x86_64.tar.gz }
          - { os: macos-latest,     label: macos-aarch64,  zig_pkg: zig-aarch64-macos-0.16.0,  ext: tar.xz, asset: tau-macos-aarch64.tar.gz }
          - { os: windows-latest,   label: windows-x86_64, zig_pkg: zig-x86_64-windows-0.16.0, ext: zip,    asset: tau-windows-x86_64.zip }
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/${{ matrix.zig_pkg }}.${{ matrix.ext }}" -o "$RUNNER_TEMP/zig.${{ matrix.ext }}"
          mkdir -p "$HOME/zig"
          tar -xf "$RUNNER_TEMP/zig.${{ matrix.ext }}" -C "$HOME/zig" --strip-components=1
          "$HOME/zig/zig" version

      - name: Install Zig 0.16.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://ziglang.org/download/0.16.0/${{ matrix.zig_pkg }}.${{ matrix.ext }}"
          curl.exe -fsSL $url -o "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" "$env:USERPROFILE"
          Move-Item "$env:USERPROFILE\${{ matrix.zig_pkg }}" "$env:USERPROFILE\zig"
          & "$env:USERPROFILE\zig\zig.exe" version

      - name: Build
        shell: bash
        run: '"$HOME/zig/zig" build'

      - name: Install via install.sh and run the first-run path
        # Stage the built binary exactly where install.sh looks for a latest
        # release, point TAU_BASE_URL at the staged tree, then run the clean
        # HOME e2e driver on the INSTALLED binary — not the build output.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p srv/latest/download
          tar -czf "srv/latest/download/${{ matrix.asset }}" -C zig-out/bin tau
          (cd srv/latest/download && { sha256sum "${{ matrix.asset }}" 2>/dev/null || shasum -a 256 "${{ matrix.asset }}"; } > SHA256SUMS.txt)
          TAU_BASE_URL="file://$PWD/srv" sh ./install.sh --dir "$RUNNER_TEMP/tau-bin"
          "$RUNNER_TEMP/tau-bin/tau" --version
          ./scripts/e2e-first-run.sh "$RUNNER_TEMP/tau-bin/tau"

      - name: Install via install.ps1 and run the first-run path (Windows)
        # Same staging contract as the POSIX legs; the staged tree is reached
        # via a file:// TAU_BASE_URL. SHA256SUMS.txt is written in the exact
        # '<hash>  <name>' format the installer matches on.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force srv/latest/download | Out-Null
          Compress-Archive zig-out/bin/tau.exe "srv/latest/download/${{ matrix.asset }}"
          $h = (Get-FileHash -Algorithm SHA256 "srv/latest/download/${{ matrix.asset }}").Hash.ToLower()
          Set-Content -Path srv/latest/download/SHA256SUMS.txt -Value "$h  ${{ matrix.asset }}" -Encoding ASCII
          $env:TAU_BASE_URL = "file:///" + (Resolve-Path srv).Path.Replace('\','/')
          ./install.ps1 -Dir "$env:RUNNER_TEMP/tau-bin"
          & "$env:RUNNER_TEMP/tau-bin/tau.exe" --version
          & ./scripts/e2e-first-run.ps1 -Tau "$env:RUNNER_TEMP/tau-bin\tau.exe"

  upgrade:
    # Upgrade-path e2e: builds tau, then hands it to scripts/e2e-upgrade.{sh,
    # ps1}, which stage the binary as BOTH a pinned older release
    # (download/v0.3.9/) and a newer one (download/v99.9.9/) under a file://
    # release tree — no network. Each leg installs the pinned version through
    # the shipped installer, wires a zed client entry at the installed path,
    # upgrades, and proves `tau doctor` is clean on the swapped binary with
    # the wiring still ok. POSIX legs run `tau upgrade` itself (in place);
    # the Windows leg pins the exit-111 "re-run install.ps1" contract and
    # exercises that documented path instead.
    name: upgrade (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg per release artifact, same zig archives as the test job.
          - { os: ubuntu-latest,    label: linux-x86_64,   zig_pkg: zig-x86_64-linux-0.16.0,   ext: tar.xz }
          - { os: ubuntu-24.04-arm, label: linux-aarch64,  zig_pkg: zig-aarch64-linux-0.16.0,  ext: tar.xz }
          - { os: macos-15-intel,   label: macos-x86_64,   zig_pkg: zig-x86_64-macos-0.16.0,   ext: tar.xz }
          - { os: macos-latest,     label: macos-aarch64,  zig_pkg: zig-aarch64-macos-0.16.0,  ext: tar.xz }
          - { os: windows-latest,   label: windows-x86_64, zig_pkg: zig-x86_64-windows-0.16.0, ext: zip }
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/${{ matrix.zig_pkg }}.${{ matrix.ext }}" -o "$RUNNER_TEMP/zig.${{ matrix.ext }}"
          mkdir -p "$HOME/zig"
          tar -xf "$RUNNER_TEMP/zig.${{ matrix.ext }}" -C "$HOME/zig" --strip-components=1
          "$HOME/zig/zig" version

      - name: Install Zig 0.16.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://ziglang.org/download/0.16.0/${{ matrix.zig_pkg }}.${{ matrix.ext }}"
          curl.exe -fsSL $url -o "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" "$env:USERPROFILE"
          Move-Item "$env:USERPROFILE\${{ matrix.zig_pkg }}" "$env:USERPROFILE\zig"
          & "$env:USERPROFILE\zig\zig.exe" version

      - name: Build
        shell: bash
        run: '"$HOME/zig/zig" build'

      - name: Run the upgrade-path e2e
        # The driver stages the release tree, pinned install, and scratch
        # HOME itself — the leg just points it at the build output.
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/e2e-upgrade.sh "$PWD/zig-out/bin/tau"

      - name: Run the upgrade-path e2e (Windows)
        # tau upgrade is POSIX-only by design (exit 111 → "re-run
        # install.ps1"); the driver pins that contract and then drives the
        # documented install.ps1 -Version re-run into the same dir.
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/e2e-upgrade.ps1 -Tau zig-out/bin/tau.exe
